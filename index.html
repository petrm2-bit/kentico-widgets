<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kentico widgets — preview</title>
  <style>
    @font-face {
      font-family: "GT Walsheim";
      src: url("https://download.kentico.com/Assets/GT-Walsheim-Bold.woff");
      font-weight: 700;
    }
    body {
      font-family: "GT Walsheim", Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      color: #1A1A1A;
    }
    h2 {
      font-weight: 700;
    }
    .preview-label {
      max-width: 1030px;
      margin: 0 auto 24px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9B9B9B;
      border-bottom: 1px solid #EEE;
      padding-bottom: 8px;
    }
  </style>
</head>
<body>

  <p class="preview-label">apac-pains</p>
  <div data-widget="apac-pains"></div>
  <script src="./apac-pains/apac-pains.js" defer></script>

</body>
</html>
